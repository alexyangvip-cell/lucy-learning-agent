<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="title description">
  <title id="title">单词擂台任务板</title>
  <description id="description">一块带有翻转单词卡、闪电连击图标和五个单词节点的橙紫色任务板。</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="960" height="240" rx="28" fill="url(#background)"/>
  <circle cx="850" cy="35" r="110" fill="#fbbf24" opacity="0.12"/>
  <circle cx="85" cy="245" r="130" fill="#38bdf8" opacity="0.12"/>
  <g transform="translate(60 44)" filter="url(#shadow)">
    <path d="M40 8 L52 56 L88 56 L60 86 L70 132 L40 102 L10 132 L20 86 L-8 56 L28 56 Z" fill="#fbbf24"/>
    <path d="M40 8 L52 56 L40 56 Z M40 102 L70 132 L40 132 Z M28 56 L40 56 L10 132 L20 86 Z" fill="#f59e0b"/>
  </g>
  <g transform="translate(210 38)" filter="url(#shadow)">
    <rect width="330" height="164" rx="18" fill="url(#card)"/>
    <text x="28" y="48" fill="#7c2d12" font-family="Arial, sans-serif" font-size="17" font-weight="700">WORD ARENA</text>
    <text x="28" y="92" fill="#1e1b4b" font-family="Arial, sans-serif" font-size="30" font-weight="700">Vocab Quest</text>
    <text x="28" y="126" fill="#9d174d" font-family="Arial, sans-serif" font-size="16">记一词，闯一关。</text>
    <path d="M28 142 H288" stroke="#9a3412" stroke-width="3" stroke-dasharray="8 8" opacity="0.6"/>
    <rect x="244" y="118" width="48" height="34" rx="8" fill="#1e1b4b"/>
    <text x="268" y="141" fill="#fde68a" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">A a</text>
  </g>
  <g transform="translate(626 73)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 40 H238" stroke="#c4b5fd" stroke-width="5" opacity="0.65"/>
    <g fill="#1e1b4b" stroke="#fde68a" stroke-width="5">
      <circle cx="24" cy="40" r="18"/>
      <circle cx="78" cy="40" r="18"/>
      <circle cx="132" cy="40" r="18"/>
      <circle cx="186" cy="40" r="18"/>
      <circle cx="240" cy="40" r="18"/>
    </g>
    <g fill="#fde68a" stroke="none" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
      <text x="24" y="46">1</text>
      <text x="78" y="46">2</text>
      <text x="132" y="46">3</text>
      <text x="186" y="46">4</text>
      <text x="240" y="46">5</text>
    </g>
    <path d="M22 95 C65 73 102 121 146 96 C184 74 217 105 249 88" stroke="#fb923c" stroke-width="4" stroke-dasharray="7 9"/>
    <path d="M246 77 L261 88 L247 100" stroke="#fb923c" stroke-width="4"/>
  </g>
</svg>
