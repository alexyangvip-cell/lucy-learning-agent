<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="title description">
  <title id="title">英语侦探任务板</title>
  <description id="description">一块带有放大镜、英文线索卡和五个关卡节点的蓝紫色任务板。</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="960" height="240" rx="28" fill="url(#background)"/>
  <circle cx="850" cy="35" r="110" fill="#a78bfa" opacity="0.13"/>
  <circle cx="85" cy="245" r="130" fill="#38bdf8" opacity="0.12"/>
  <g transform="translate(62 42)" filter="url(#shadow)">
    <circle cx="62" cy="62" r="48" fill="none" stroke="#67e8f9" stroke-width="14"/>
    <path d="M98 98 L145 145" stroke="#67e8f9" stroke-width="18" stroke-linecap="round"/>
    <path d="M37 62 H87 M62 37 V87" stroke="#e0f2fe" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  </g>
  <g transform="translate(228 38)" filter="url(#shadow)">
    <rect width="330" height="164" rx="18" fill="url(#card)"/>
    <circle cx="30" cy="30" r="7" fill="#dc2626"/>
    <text x="52" y="38" fill="#78350f" font-family="Arial, sans-serif" font-size="18" font-weight="700">TOP SECRET</text>
    <text x="28" y="82" fill="#1e1b4b" font-family="Arial, sans-serif" font-size="28" font-weight="700">English Quest</text>
    <text x="28" y="116" fill="#4338ca" font-family="Arial, sans-serif" font-size="17">Find the clue. Solve the case.</text>
    <path d="M28 139 H288" stroke="#a16207" stroke-width="3" stroke-dasharray="8 8" opacity="0.6"/>
  </g>
  <g transform="translate(626 73)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 40 H238" stroke="#c4b5fd" stroke-width="5" opacity="0.65"/>
    <g fill="#1e1b4b" stroke="#a5f3fc" stroke-width="5">
      <circle cx="24" cy="40" r="18"/>
      <circle cx="78" cy="40" r="18"/>
      <circle cx="132" cy="40" r="18"/>
      <circle cx="186" cy="40" r="18"/>
      <circle cx="240" cy="40" r="18"/>
    </g>
    <g fill="#e0f2fe" stroke="none" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
      <text x="24" y="46">1</text>
      <text x="78" y="46">2</text>
      <text x="132" y="46">3</text>
      <text x="186" y="46">4</text>
      <text x="240" y="46">5</text>
    </g>
    <path d="M22 95 C65 73 102 121 146 96 C184 74 217 105 249 88" stroke="#fbbf24" stroke-width="4" stroke-dasharray="7 9"/>
    <path d="M246 77 L261 88 L247 100" stroke="#fbbf24" stroke-width="4"/>
  </g>
</svg>
